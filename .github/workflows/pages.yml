name: Pages

# Hosts the web game on GitHub Pages. The game is plain static files with
# relative paths and a service worker scoped to its own directory, so it
# runs unchanged under the repository's subpath. Only the files the game
# itself needs are published: the tests, tools, store kit and Android
# project stay out of the site.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'privacy.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir -p site
          cp index.html manifest.webmanifest sw.js privacy.html site/
          cp -r css js icons site/
          # Pages runs Jekyll by default; this tells it to serve the files as they are.
          touch site/.nojekyll
          ls -R site | head -50
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run, with GitHub Actions as its source.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
