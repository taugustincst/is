name: Pages

# Hosts the web game on GitHub Pages. The game is plain static files with
# relative paths and a service worker scoped to its own directory, so it
# runs unchanged under the repository's subpath. Only the files the game
# itself needs are published: the tests, tools, store kit and Android
# project stay out of the site. The site lives on the gh-pages branch.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'privacy.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# One deployment at a time; a newer push supersedes one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish to the gh-pages branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir -p site
          cp index.html manifest.webmanifest sw.js privacy.html site/
          cp -r css js icons site/
          # Pages runs Jekyll by default; this tells it to serve the files as they are.
          touch site/.nojekyll
          ls -R site | head -50
      # The site is served from the gh-pages branch, which GitHub Pages picks
      # up on its own for a public repository: no site has to be created by
      # hand first, which the deploy-pages route needs an admin token for
      # ("Resource not accessible by integration" from the workflow's own).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publish ${{ github.sha }}'
