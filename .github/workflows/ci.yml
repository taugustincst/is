name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Content and engine checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/validate.js
      - run: node tools/regress.js

  browser:
    name: Browser suite
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright-core install --with-deps chromium
      - run: bash tests/browser/run.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-logs
          path: tests/out/*.log
