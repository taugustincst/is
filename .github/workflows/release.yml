name: Release

# Builds the Android APK, the single-file web build, the itch.io zip and the
# desktop packages (Windows, macOS, Linux), and attaches them all to a
# GitHub Release. Run it from the Actions tab with a version number, or push
# a tag such as v1.6.0. With a BUTLER_API_KEY secret and an ITCH_TARGET
# variable (user/game) set, the itch.io page is updated as well.
#
# The APK is the sideload shell (android/app), signed with the debug key
# (its build.gradle falls back to it when no keystore.properties exists on
# the builder), so it installs by sideloading on any Android device. The
# Google Play edition (android/play, a Trusted Web Activity under the
# listing's package name) is built as a bundle as well, and attached as the
# -play.aab when the repository holds the upload key in its secrets
# (ANDROID_UPLOAD_KEYSTORE, base64 of the .jks, with
# ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS and
# ANDROID_UPLOAD_KEY_PASSWORD); without them the bundle is debug-signed,
# which Play refuses, so it is left off the release (see android/PLAY_STORE.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for the release, e.g. 1.5.0 (the tag becomes v<version>)'
        required: true
        type: string
      version_code:
        description: 'Android versionCode. Default: from the version, 1.14.1 -> 11401. Pass a higher one if the Play Console shows one.'
        required: false
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
  ITCH_TARGET: ${{ vars.ITCH_TARGET }}
  ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.ver.outputs.name }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          # Every upload to Play must carry a higher versionCode than the
          # last. It is derived from the version so it climbs with it and
          # can be read off a release: 1.14.1 is 11401. The version_code
          # input overrides it when the console already holds a higher one.
          CODE="${{ inputs.version_code }}"
          if [ -z "$CODE" ]; then
            IFS=. read -r MA MI PA <<< "$V"
            MA="${MA%%[^0-9]*}"; MI="${MI%%[^0-9]*}"; PA="${PA%%[^0-9]*}"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version $V, tag v$V, versionCode $CODE"

      # The web build: one file, nothing else to fetch.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the single-file web game
        run: |
          node tools/validate.js
          node tools/regress.js
          node tools/bundle.js
          cp dist/elderon.html "chronicles-of-elderon-${{ steps.ver.outputs.name }}.html"
          node tools/itch.js
          cp dist/chronicles-of-elderon-itch.zip "chronicles-of-elderon-${{ steps.ver.outputs.name }}-itch.zip"

      # The itch.io page, when the repository holds the key for it.
      - name: Push the web build to itch.io
        if: env.BUTLER_API_KEY != '' && env.ITCH_TARGET != ''
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip butler && chmod +x butler
          ./butler push dist/chronicles-of-elderon-itch.zip "$ITCH_TARGET:html5" --userversion "${{ steps.ver.outputs.name }}"

      # The Android build, on a runner that has the SDK (see ci.yml for why
      # sdkmanager is found by hand).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'
      - name: Install the SDK platform and build-tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      # The upload key, when the repository holds it: the keystore is decoded
      # next to the file build.gradle reads, and both are ignored by git.
      - name: Set up the Play upload key
        if: env.ANDROID_UPLOAD_KEYSTORE != ''
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE" | base64 -d > upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "release builds will be signed with the upload key"
      - name: Build the sideload APK and the Play bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }}
          cp app/build/outputs/apk/release/app-release.apk \
             "../chronicles-of-elderon-${{ steps.ver.outputs.name }}.apk"
          # The Play bundle goes on the release only when it carries the
          # upload key; a debug-signed one is nothing Play would take.
          if [ -f keystore.properties ]; then
            cp play/build/outputs/bundle/release/play-release.aab \
               "../chronicles-of-elderon-${{ steps.ver.outputs.name }}-play.aab"
            echo "Play bundle attached, versionCode ${{ steps.ver.outputs.code }}"
          else
            echo "no upload key in the secrets: the Play bundle is built but not attached"
          fi
      # The build that Play pulled for not loading named a class its dex did
      # not hold. Every build that leaves here is checked for that first,
      # the Play edition through the APK of the same build.
      - name: Check the builds would load
        run: |
          node tools/check-apk.js android/app/build/outputs/apk/release/app-release.apk --package com.elderon.tactics
          node tools/check-apk.js android/play/build/outputs/apk/release/play-release.apk --package com.taugustincst.elderon

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Chronicles of Elderon ${{ steps.ver.outputs.name }}
          files: |
            chronicles-of-elderon-${{ steps.ver.outputs.name }}.apk
            chronicles-of-elderon-${{ steps.ver.outputs.name }}-play.aab
            chronicles-of-elderon-${{ steps.ver.outputs.name }}.html
            chronicles-of-elderon-${{ steps.ver.outputs.name }}-itch.zip
          body: |
            **Android:** download the `.apk` and open it on the phone to install (Android will ask once to allow installs from this source). It is signed with a debug key for sideloading, not a Google Play upload.

            **Google Play:** the `-play.aab`, when attached, is the Play edition (versionCode ${{ steps.ver.outputs.code }}) to upload in the Play Console, signed with the upload key from the repository's secrets; see `android/PLAY_STORE.md`.

            **Play in a browser:** the `.html` file is the whole game in one file. Open it in Chrome, Firefox or Safari; nothing else is fetched, and it works offline once opened.

            **Or just play online:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

            **On a computer:** the `-win32-x64`, `-darwin-arm64` (Apple silicon), `-darwin-x64` (Intel Mac) and `-linux-x64` zips are the game as a program, one window and no browser. They are not code-signed, so Windows and macOS ask once before the first launch. The `-itch.zip` is the web build packed for itch.io.

  # The desktop packages: the single-file build in an Electron window, one
  # zip per platform, attached to the same release once it exists.
  desktop:
    name: Desktop packages
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the wrapper's tools
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Package for every platform
        working-directory: desktop
        run: |
          npm run prepare-game
          for target in win32:x64 darwin:x64 darwin:arm64 linux:x64; do
            platform="${target%%:*}"; arch="${target##*:}"
            npx electron-packager . "Chronicles of Elderon" --platform="$platform" --arch="$arch" --out=out --overwrite --asar \
              --app-version="${{ needs.release.outputs.name }}" --app-copyright="taugustincst" \
              --ignore="^/out" --ignore="^/node_modules/\.cache"
            (cd out && zip -qry "../../chronicles-of-elderon-${{ needs.release.outputs.name }}-$platform-$arch.zip" "Chronicles of Elderon-$platform-$arch")
          done
          ls -la ..
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            chronicles-of-elderon-${{ needs.release.outputs.name }}-win32-x64.zip
            chronicles-of-elderon-${{ needs.release.outputs.name }}-darwin-x64.zip
            chronicles-of-elderon-${{ needs.release.outputs.name }}-darwin-arm64.zip
            chronicles-of-elderon-${{ needs.release.outputs.name }}-linux-x64.zip
